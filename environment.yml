# Agent Swarm at the Edge — conda env definition
# Create with: conda env create -f environment.yml
# Update existing env with: conda env update -n swarm -f environment.yml --prune

name: swarm
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - pip:
      - dbos
      - psycopg[binary]
      - pydantic>=2.0
      - deepdiff
      - httpx
      - arize-phoenix
      - opentelemetry-api
      - opentelemetry-sdk
      - pytest==9.0.3
      - pytest-asyncio==1.4.0
      - pytest-mock==3.15.1